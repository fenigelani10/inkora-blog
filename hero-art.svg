<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Ambient Glow Blobs -->
  <circle cx="340" cy="220" r="180" fill="url(#bgGrad)" filter="blur(60px)" />
  <circle cx="180" cy="320" r="140" fill="#c084fc" fill-opacity="0.25" filter="blur(50px)" />
  
  <!-- Abstract Decorative Ring & Orbits -->
  <circle cx="300" cy="250" r="190" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="300" cy="250" r="230" stroke="#ec4899" stroke-opacity="0.1" stroke-width="1" />
  
  <!-- Main Featured Blog Glass Card -->
  <g filter="url(#softShadow)">
    <rect x="90" y="80" width="380" height="260" rx="20" fill="url(#cardGrad1)" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Image placeholder mock inside card -->
    <rect x="110" y="100" width="340" height="130" rx="12" fill="#e2e8f0" />
    <!-- Gradient banner overlay -->
    <rect x="110" y="100" width="340" height="130" rx="12" fill="url(#badgeGrad)" fill-opacity="0.85" />
    <path d="M110 200 C 180 160, 260 210, 450 150 L 450 230 L 110 230 Z" fill="#ffffff" fill-opacity="0.2" />
    
    <!-- Category Pill inside banner -->
    <rect x="125" y="115" width="85" height="22" rx="11" fill="#ffffff" fill-opacity="0.9" />
    <text x="167" y="130" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">CREATIVITY</text>
    
    <!-- Card title & excerpt lines -->
    <text x="125" y="255" font-family="'Newsreader', Georgia, serif" font-size="16" font-weight="700" fill="#1e293b">The Quiet Power of Mindful Writing</text>
    <text x="125" y="278" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Finding clarity, intentional focus, and voice in a hyper-connected age.</text>
    
    <!-- Author snippet -->
    <circle cx="137" cy="312" r="12" fill="#8b5cf6" />
    <text x="137" y="316" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
    <text x="156" y="312" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">Elena Vance</text>
    <text x="156" y="324" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">5 min read • Sep 24</text>
    
    <!-- Bookmark indicator -->
    <path d="M430 305 h12 v16 l-6 -4 l-6 4 z" fill="#8b5cf6" />
  </g>

  <!-- Floating Floating Stat/Badge Glass Card Top-Right -->
  <g filter="url(#softShadow)">
    <rect x="360" y="40" width="180" height="70" rx="16" fill="#ffffff" fill-opacity="0.92" stroke="#e0e7ff" stroke-width="1" />
    <circle cx="392" cy="75" r="16" fill="#ec4899" fill-opacity="0.15" />
    <path d="M387 75 L391 79 L398 71" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="418" y="68" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">99k+ Readers</text>
    <text x="418" y="84" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Global Community</text>
  </g>

  <!-- Floating Quote / Reaction Glass Card Bottom-Left -->
  <g filter="url(#softShadow)">
    <rect x="50" y="310" width="200" height="85" rx="16" fill="#ffffff" fill-opacity="0.94" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="75" cy="335" r="14" fill="#8b5cf6" fill-opacity="0.2" />
    <path d="M72 331 C72 328 75 328 75 330 C75 332 72 334 72 337 M78 331 C78 328 81 328 81 330 C81 332 78 334 78 337" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" />
    <text x="96" y="337" font-family="'Newsreader', Georgia, serif" font-size="12" font-style="italic" fill="#334155">"Stories worth telling."</text>
    <!-- Reaction pills -->
    <rect x="68" y="360" width="48" height="20" rx="10" fill="#f1f5f9" />
    <text x="82" y="373" font-family="system-ui, sans-serif" font-size="10" fill="#e11d48">❤️ 342</text>
    <rect x="122" y="360" width="48" height="20" rx="10" fill="#f1f5f9" />
    <text x="136" y="373" font-family="system-ui, sans-serif" font-size="10" fill="#7c3aed">💬 89</text>
  </g>

  <!-- Floating Sparkles -->
  <path d="M510 210 L514 220 L524 224 L514 228 L510 238 L506 228 L496 224 L506 220 Z" fill="#f59e0b" />
  <path d="M120 40 L123 48 L131 51 L123 54 L120 62 L117 54 L109 51 L117 48 Z" fill="#8b5cf6" />
</svg>
